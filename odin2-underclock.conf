# Underclock profiles: max CPU clock in kHz for cores 0-2, cores 3-6, core 7.
# Each value must be one of that cluster's scaling_available_frequencies
# (/sys/devices/system/cpu/cpufreq/policy0, policy3, policy7). 0 = stock.
# Stock: 2016000 2803200 2956800. Edit, then: sudo systemctl restart odin2-underclock
SMALL="1785600 2323200 2476800"    # 1.79 / 2.32 / 2.48 GHz
MEDIUM="1555200 2054400 2092800"   # 1.56 / 2.05 / 2.09 GHz
LARGE="1459200 1785600 1843200"    # 1.46 / 1.79 / 1.84 GHz

# Profile used until one is chosen with underclock-profile.sh.
DEFAULT_PROFILE=small

# Where underclock-profile.sh saves the chosen profile (small, medium, large or
# stock). Set by install.sh to the folder it was run from.
PROFILE_FILE=/home/steamos/underclock/profile
